<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1366"><rect width="100%" height="100%" fill="#FAF9F6"/><text x="24" y="46" font-family="Arial" font-size="14" fill="#006D82">Home / Services / AI, Data &amp;</text><text x="24" y="64.9" font-family="Arial" font-size="14" fill="#006D82">Automation / AI Systems &amp; Agentic</text><text x="24" y="83.80000000000001" font-family="Arial" font-size="14" fill="#006D82">Automation</text><text x="24" y="120.70000000000002" font-family="Arial" font-size="12" fill="#006D82">FORMAL SERVICE</text><text x="24" y="184.90000000000003" font-family="Arial" font-size="40" fill="#0B0F14">AI Systems</text><text x="24" y="238.90000000000003" font-family="Arial" font-size="40" fill="#0B0F14">&amp; Agentic</text><text x="24" y="292.90000000000003" font-family="Arial" font-size="40" fill="#0B0F14">Automation</text><text x="24" y="344.90000000000003" font-family="Arial" font-size="18" fill="#2A3542">Explore AI-assisted</text><text x="24" y="369.20000000000005" font-family="Arial" font-size="18" fill="#2A3542">workflows and automation</text><text x="24" y="393.50000000000006" font-family="Arial" font-size="18" fill="#2A3542">with clear information,</text><text x="24" y="417.80000000000007" font-family="Arial" font-size="18" fill="#2A3542">evaluation and</text><text x="24" y="442.1000000000001" font-family="Arial" font-size="18" fill="#2A3542">human-control boundaries.</text><text x="24" y="480.4000000000001" font-family="Arial" font-size="12" fill="#006D82">YOUR DECISION</text><text x="24" y="532.6000000000001" font-family="Arial" font-size="28" fill="#0B0F14">Where could AI</text><text x="24" y="570.4000000000001" font-family="Arial" font-size="28" fill="#0B0F14">help, and where</text><text x="24" y="608.2" font-family="Arial" font-size="28" fill="#0B0F14">is human control</text><text x="24" y="646.0" font-family="Arial" font-size="28" fill="#0B0F14">needed?</text><text x="24" y="687.8" font-family="Arial" font-size="12" fill="#006D82">POSSIBLE FOCUS</text><text x="24" y="732.0" font-family="Arial" font-size="20" fill="#0B0F14">Workflow and</text><text x="24" y="759.0" font-family="Arial" font-size="20" fill="#0B0F14">suitability assessment</text><text x="24" y="806.0" font-family="Arial" font-size="20" fill="#0B0F14">Source and data</text><text x="24" y="833.0" font-family="Arial" font-size="20" fill="#0B0F14">boundaries</text><text x="24" y="880.0" font-family="Arial" font-size="20" fill="#0B0F14">Evaluation and human</text><text x="24" y="907.0" font-family="Arial" font-size="20" fill="#0B0F14">oversight</text><text x="24" y="946.0" font-family="Arial" font-size="12" fill="#006D82">SCOPE AND BOUNDARIES</text><text x="24" y="986.2" font-family="Arial" font-size="16" fill="#2A3542">AI can produce incorrect</text><text x="24" y="1007.8000000000001" font-family="Arial" font-size="16" fill="#2A3542">output. Data access, source</text><text x="24" y="1029.4" font-family="Arial" font-size="16" fill="#2A3542">policy, evaluation and human</text><text x="24" y="1051.0" font-family="Arial" font-size="16" fill="#2A3542">approval need explicit</text><text x="24" y="1072.6" font-family="Arial" font-size="16" fill="#2A3542">agreement; no autonomous</text><text x="24" y="1094.1999999999998" font-family="Arial" font-size="16" fill="#2A3542">commitments are implied.</text><text x="24" y="1131.7999999999997" font-family="Arial" font-size="12" fill="#006D82">KEEP EXPLORING</text><path d="M2 20 L20 2 M4 2 H20 V18" transform="translate(272 1159.9999999999998)" fill="none" stroke="#006D82" stroke-width="2"/><text x="24" y="1175.9999999999998" font-family="Arial" font-size="20" fill="#006D82">Back to AI, Data &amp;</text><text x="24" y="1202.9999999999998" font-family="Arial" font-size="20" fill="#006D82">Automation</text><path d="M2 20 L20 2 M4 2 H20 V18" transform="translate(272 1233.9999999999998)" fill="none" stroke="#006D82" stroke-width="2"/><text x="24" y="1249.9999999999998" font-family="Arial" font-size="2