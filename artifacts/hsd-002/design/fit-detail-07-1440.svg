<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1021"><rect width="100%" height="100%" fill="#FAF9F6"/><text x="64" y="46" font-family="Arial" font-size="14" fill="#006D82">Home / Services / Immersive &amp; Creative / Spatial Computing &amp; Immersive Platforms</text><text x="64" y="82.9" font-family="Arial" font-size="12" fill="#006D82">FORMAL SERVICE</text><text x="64" y="179.10000000000002" font-family="Arial" font-size="72" fill="#0B0F14">Spatial Computing &amp;</text><text x="64" y="276.3" font-family="Arial" font-size="72" fill="#0B0F14">Immersive Platforms</text><text x="64" y="345.5" font-family="Arial" font-size="24" fill="#2A3542">Explore interactive 3D and spatial experiences with an</text><text x="64" y="377.9" font-family="Arial" font-size="24" fill="#2A3542">equivalent accessible path to essential content.</text><text x="64" y="418.29999999999995" font-family="Arial" font-size="12" fill="#006D82">YOUR DECISION</text><text x="64" y="482.49999999999994" font-family="Arial" font-size="40" fill="#0B0F14">When would a spatial experience make an idea clearer?</text><text x="64" y="528.5" font-family="Arial" font-size="12" fill="#006D82">POSSIBLE FOCUS</text><text x="64" y="578.7" font-family="Arial" font-size="26" fill="#0B0F14">Spatial journeys and interaction concepts</text><text x="64" y="633.8000000000001" font-family="Arial" font-size="26" fill="#0B0F14">Interactive 3D experiences</text><text x="64" y="688.9000000000001" font-family="Arial" font-size="26" fill="#0B0F14">Performance and accessible alternatives</text><text x="64" y="730.0000000000001" font-family="Arial" font-size="12" fill="#006D82">SCOPE AND BOUNDARIES</text><text x="64" y="770.2000000000002" font-family="Arial" font-size="16" fill="#2A3542">Device support, asset rights and performance targets need project-specific validation.</text><text x="64" y="791.8000000000002" font-family="Arial" font-size="16" fill="#2A3542">Essential content must remain accessible without 3D.</text