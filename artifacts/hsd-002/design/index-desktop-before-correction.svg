mmit to a</text><text x="64" y="836.8" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">plan.</text><text x="64" y="890.4" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#006D82">Strategy &amp; Architecture ↗</text><rect x="64" y="954.8" width="1312" height="1" fill="#D8D3C8"/><text x="64" y="1014.8" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#006D82">02 / 3 FORMAL SERVICES</text><text x="64" y="1079" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="400" fill="#006D82">Digital Products &amp; Growth ↗</text><text x="64" y="1125" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">Design and build websites, platforms and digital products around the people who use</text><text x="64" y="1146.6" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">them.</text><text x="64" y="1200.2" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#006D82">Platform &amp; Product Engineering ↗</text><text x="64" y="1248.6000000000001" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#006D82">Product Design &amp; Experience Engineering ↗</text><text x="64" y="1297.0000000000002" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#006D82">Commerce, Content &amp; Growth Platforms ↗</text><rect x="64" y="1361.4000000000003" width="1312" height="1" fill="#D8D3C8"/><text x="64" y="1421.4000000000003" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#006D82">03 / 2 FORMAL SERVICES</text><text x="64" y="1485.6000000000004" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="400" fill="#006D82">AI, Data &amp; Automation ↗</text><text x="64" y="1531.6000000000004" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">Find practical ways to use AI, automate repetitive work and make better use of your</text><text x="64" y="1553.2000000000003" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">data.</text><text x="64" y="1606.8000000000004" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#006D82">AI Systems &amp; Agentic Automation ↗</text><text x="64" y="1655.2000000000005" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#006D82">Data Platforms &amp; Analytics ↗</text><rect x="64" y="1719.6000000000006" width="1312" height="1" fill="#D8D3C8"/><text x="64" y="1779.6000000000006" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#006D82">04 / 2 FORMAL SERVICES</text><text x="64" y="1843.8000000000006" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="400" fill="#006D82">Immersive &amp; Creative ↗</text><text x="64" y="1889.8000000000006" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">Explain ideas through visual design, interactive experiences and 3D.</text><text x="64" y="1943.4000000000005" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#006D82">Spatial Computing &amp; Immersive Platforms ↗</text><text x="64" y="1991.8000000000006" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#006D82">Creative &amp; Visual Design Services ↗</text><rect x="64" y="2056.2000000000007" width="1312" height="1" fill="#D8D3C8"/><text x="64" y="2116.2000000000007" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#006D82">05 / 2 FORMAL SERVICES</text><text x="64" y="2180.4000000000005" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="400" fill="#006D82">Cloud, Reliability &amp; Trust ↗</text><text x="64" y="2226.4000000000005" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">Build and maintain the infrastructure, security and reliability your systems need.</text><text x="64" y="2280.0000000000005" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#006D82">Cloud, DevOps &amp; Platform Reliability ↗</text><text x="64" y="2328.4000000000005" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#006D82">Security, Privacy &amp; Trust Engineering ↗</text><rect x="64" y="2392.8000000000006" width="1312" height="1" fill="#D8D3C8"/><text x="64" y="2516.8000000000006" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#006D82">EVIDENCE</text><text x="64" y="2581.0000000000005" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="400" fill="#0B0F14">Work and demos</text><text x="64" y="2647.0000000000005" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="400" fill="#0B0F14">Client work</text><text x="64" y="2688.8000000000006" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">No client projects are published here yet.</text><text x="64" y="2754.4000000000005" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="400" fill="#0B0F14">Hengshi-owned demos</text><text x="64" y="2796.2000000000007" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">No demos are published here yet. A demo will be labelled separately from client work.</text><text x="64" y="3021.8000000000006" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#00D4FF">LET’S TALK</text><text x="64" y="3094.0000000000005" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="400" fill="#FAF9F6">Tell us about your project.</text><text x="64" y="3152.8000000000006" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" fill="#D8D3C8">Book a 30-minute call to discuss what you need and see how we could help.</text><rect x="64" y="3191.100000000001" width="304" height="56" fill="#00D4FF"/><text x="88" y="3222.100000000001" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#0B0F14">Book a call</text><text x="64" y="3275.100000000001" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#D8D3C8">30-minute introductory call.</text><rect x="64" y="3327.3000000000006" width="1312" height="1" fill="#2A3542"/><svg x="64" y="3367.3000000000006" width="32" height="32" viewBox="0 0 80 80"><rect width="80" height="80" fill="#0B0F14"/><g fill="none" stroke="#FAF9F6" stroke-width="6" stroke-linecap="square"><path d="M30 10 H10 V30 M50 10 H70 V30 M70 50 V70 H50 M30 70 H10 V50"/></g><path d="M16 52 H32 V40 H48 V28 H64" fill="none" stroke="#00D4FF" stroke-width="5"/><rect x="61" y="25" width="6" height="6" fill="#00D4FF"/></svg><text x="108" y="3388.3000000000006" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" fill="#FAF9F6">Hengshi Design</text><text x="64" y="3445.3000000000006" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#FAF9F6">Privacy policy    Accessibility</text><text x="64" y="3478.2000000000007" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#D8D3C8">© 2026 Hengshi Design</text></svg>