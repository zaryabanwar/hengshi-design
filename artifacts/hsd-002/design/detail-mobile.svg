t-size="40" font-weight="400" fill="#0B0F14">Product</text><text x="24" y="411.9" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="400" fill="#0B0F14">Design &amp;</text><text x="24" y="465.9" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="400" fill="#0B0F14">Experience</text><text x="24" y="519.9" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="400" fill="#0B0F14">Engineering</text><text x="24" y="579.9" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" fill="#2A3542">Understand user journeys</text><text x="24" y="604.1999999999999" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" fill="#2A3542">and turn them into clear,</text><text x="24" y="628.5" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" fill="#2A3542">usable interfaces and</text><text x="24" y="652.8" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" fill="#2A3542">interaction patterns.</text><text x="24" y="697.1" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#2A3542">Capability descriptions explain</text><text x="24" y="716.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#2A3542">what we can discuss. They are not</text><text x="24" y="734.9" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#2A3542">evidence of client delivery.</text><rect x="24" y="787.8000000000001" width="272" height="1.0" fill="#D8D3C8" /><text x="24" y="839.8000000000001" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#006D82">YOUR DECISION</text><text x="24" y="892.0000000000001" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="400" fill="#0B0F14">How should the</text><text x="24" y="929.8000000000001" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="400" fill="#0B0F14">product work for</text><text x="24" y="967.6000000000001" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="400" fill="#0B0F14">the people using</text><text x="24" y="1005.4000000000001" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="400" fill="#0B0F14">it?</text><text x="24" y="1055.2000000000003" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">Start with the outcome you</text><text x="24" y="1076.8000000000002" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">need, the people involved and</text><text x="24" y="1098.4000000000003" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">the constraints your project</text><text x="24" y="1120.0000000000002" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">must work within.</text><text x="24" y="1185.6000000000004" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#006D82">POSSIBLE FOCUS</text><text x="24" y="1237.8000000000004" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="400" fill="#0B0F14">What we can</text><text x="24" y="1275.6000000000004" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="400" fill="#0B0F14">explore</text><rect x="24" y="1309.4000000000003" width="272" height="1.0" fill="#D8D3C8" /><text x="24" y="1349.4000000000003" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#0B0F14">User journeys and</text><text x="24" y="1376.4000000000003" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#0B0F14">information</text><text x="24" y="1403.4000000000003" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#0B0F14">architecture</text><rect x="24" y="1434.4000000000003" width="272" height="1.0" fill="#D8D3C8" /><text x="24" y="1474.4000000000003" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#0B0F14">Interface design and</text><text x="24" y="1501.4000000000003" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#0B0F14">design systems</text><rect x="24" y="1532.4000000000003" width="272" height="1.0" fill="#D8D3C8" /><text x="24" y="1572.4000000000003" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#0B0F14">Prototypes and</text><text x="24" y="1599.4000000000003" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#0B0F14">usability evaluation</text><text x="24" y="1666.4000000000003" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#006D82">SCOPE AND BOUNDARIES</text><text x="24" y="1718.6000000000004" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="400" fill="#0B0F14">Agree the work</text><text x="24" y="1756.4000000000003" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="400" fill="#0B0F14">before it begins</text><text x="24" y="1806.2000000000003" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">Research access, supported</text><text x="24" y="1827.8000000000002" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">devices and accessibility</text><text x="24" y="1849.4000000000003" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">criteria are agreed for each</text><text x="24" y="1871.0000000000002" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">project. Designs alone do not</text><text x="24" y="1892.6000000000004" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">establish accessibility</text><text x="24" y="1914.2000000000003" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">compliance.</text><text x="24" y="1959.8000000000002" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">Deliverables,</text><text x="24" y="1981.4" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">responsibilities, timing and</text><text x="24" y="2003.0000000000002" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">costs are agreed for each</text><text x="24" y="2024.6000000000001" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">engagement. This page does</text><text x="24" y="2046.2000000000003" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">not make a delivery</text><text x="24" y="2067.8" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">commitment.</text><text x="24" y="2173.4" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#006D82">EVIDENCE</text><text x="24" y="2225.6" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="400" fill="#0B0F14">Work and demos</text><text x="24" y="2281.4" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" fill="#0B0F14">Client work</text><text x="24" y="2321.1" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">No client projects are</text><text x="24" y="2342.7" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">published here yet.</text><text x="24" y="2402.2999999999997" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="400" fill="#0B0F14">Hengshi-owned demos</text><text x="24" y="2441.9999999999995" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">No demos are published here</text><text x="24" y="2463.5999999999995" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">yet. A demo will be labelled</text><text x="24" y="2485.1999999999994" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">separately from client work.</text><text x="24" y="2542.7999999999997" font-fam