<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1497"><rect width="100%" height="100%" fill="#FAF9F6"/><text x="24" y="46" font-family="Arial" font-size="14" fill="#006D82">Home / Services / Digital Products</text><text x="24" y="64.9" font-family="Arial" font-size="14" fill="#006D82">&amp; Growth / Product Design &amp;</text><text x="24" y="83.80000000000001" font-family="Arial" font-size="14" fill="#006D82">Experience Engineering</text><text x="24" y="120.70000000000002" font-family="Arial" font-size="12" fill="#006D82">FORMAL SERVICE</text><text x="24" y="184.90000000000003" font-family="Arial" font-size="40" fill="#0B0F14">Product</text><text x="24" y="238.90000000000003" font-family="Arial" font-size="40" fill="#0B0F14">Design &amp;</text><text x="24" y="292.90000000000003" font-family="Arial" font-size="40" fill="#0B0F14">Experience</text><text x="24" y="346.90000000000003" font-family="Arial" font-size="40" fill="#0B0F14">Engineering</text><text x="24" y="398.90000000000003" font-family="Arial" font-size="18" fill="#2A3542">Understand user journeys</text><text x="24" y="423.20000000000005" font-family="Arial" font-size="18" fill="#2A3542">and turn them into clear,</text><text x="24" y="447.50000000000006" font-family="Arial" font-size="18" fill="#2A3542">usable interfaces and</text><text x="24" y="471.80000000000007" font-family="Arial" font-size="18" fill="#2A3542">interaction patterns.</text><text x="24" y="510.1000000000001" font-family="Arial" font-size="12" fill="#006D82">YOUR DECISION</text><text x="24" y="562.3000000000001" font-family="Arial" font-size="28" fill="#0B0F14">How should the</text><text x="24" y="600.1" font-family="Arial" font-size="28" fill="#0B0F14">product work for</text><text x="24" y="637.9" font-family="Arial" font-size="28" fill="#0B0F14">the people using</text><text x="24" y="675.6999999999999" font-family="Arial" font-size="28" fill="#0B0F14">it?</text><text x="24" y="717.4999999999999" font-family="Arial" font-size="12" fill="#006D82">POSSIBLE FOCUS</text><text x="24" y="761.6999999999999" font-family="Arial" font-size="20" fill="#0B0F14">User journeys and</text><text x="24" y="788.6999999999999" font-family="Arial" font-size="20" fill="#0B0F14">information</text><text x="24" y="815.6999999999999" font-family="Arial" font-size="20" fill="#0B0F14">architecture</text><text x="24" y="862.6999999999999" font-family="Arial" font-size="20" fill="#0B0F14">Interface design and</text><text x="24" y="889.6999999999999" font-family="Arial" font-size="20" fill="#0B0F14">design systems</text><text x="24" y="936.6999999999999" font-family="Arial" font-size="20" fill="#0B0F14">Prototypes and</text><text x="24" y="963.6999999999999" font-family="Arial" font-size="20" fill="#0B0F14">usability evaluation</text><text x="24" y="1002.6999999999999" font-family="Arial" font-size="12" fill="#006D82">SCOPE AND BOUNDARIES</text><text x="24" y="1042.9" font-family="Arial" font-size="16" fill="#2A3542">Research access, supported</text><text x="24" y="1064.5" font-family="Arial" font-size="16" fill="#2A3542">devices and accessibility</text><text x="24" y="1086.1" font-family="Arial" font-size="16" fill="#2A3542">criteria are agreed for each</text><text x="24" y="1107.6999999999998" font-family="Arial" font-size="16" fill="#2A3542">project. Designs alone do not</text><text x="24" y="1129.2999999999997" font-family="Arial" font-size="16" fill="#2A3542">establish accessibility</text><text x="24" y="1150.8999999999996" font-family="Arial" font-size="16" fill="#2A3542">compliance.</text><text x="24" y="1188.4999999999995" font-family="Arial" font-size="12" fill="#006D82">KEEP EXPLORING</text><path d="M2 20 L20 2 M4 2 H20 V18" transform="translate(272 1216.6999999999996)" fill="none" stroke="#006D82" stroke-width="2"/><text x="24" y="1232.6999999999996" font-family="Arial" font-size="20" fill="#006D82">Back to Digital</text><text x="24" y="1259.6999999999996" font-family="Arial" font-size="20" fill="#006D82">Products &amp; Growth</text><path d="M2 20 L20 2 M4 2 H20 V18" transform="translate(272 1290.6999999999996)" fill="none" stroke="#006D82" stroke-width="2"/><text x="24" y="1306.6999999999996" font-family="Arial" font-size="20" fill="#006D82">Platform &amp; Product</text><text x="24" y="1333.6999999999996" font-family="Arial" font-size="20" fill="#006D82">Engineering</text><path d="M2 20 L20 2 M4 2 H20 V18" transform="translate(272 1364.6999999999996)" fill="none" stroke="#006D82" stroke-width="2"/><text x="24" y="1380.6999999999996" font-family="Arial" font-size="20" fill="#006D82">Commerce, Content &amp;</text><text x="24" y="1407.6999999999996" font-family="Arial" font-size="20" fill="#006D82">Growth Platforms</text><path d="M2 20 L20 2 M4 2 H20 V18" transform="translate(272 1438.6999999999996)" fill="none" stroke="#006D82" stroke-width="2"/><text x="24" y="1450.6999999999996" font-family="Arial" font-size="16" fill="#006D82">All services</text></svg>