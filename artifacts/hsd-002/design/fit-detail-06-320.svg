<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1261"><rect width="100%" height="100%" fill="#FAF9F6"/><text x="24" y="46" font-family="Arial" font-size="14" fill="#006D82">Home / Services / AI, Data &amp;</text><text x="24" y="64.9" font-family="Arial" font-size="14" fill="#006D82">Automation / Data Platforms &amp;</text><text x="24" y="83.80000000000001" font-family="Arial" font-size="14" fill="#006D82">Analytics</text><text x="24" y="120.70000000000002" font-family="Arial" font-size="12" fill="#006D82">FORMAL SERVICE</text><text x="24" y="184.90000000000003" font-family="Arial" font-size="40" fill="#0B0F14">Data</text><text x="24" y="238.90000000000003" font-family="Arial" font-size="40" fill="#0B0F14">Platforms &amp;</text><text x="24" y="292.90000000000003" font-family="Arial" font-size="40" fill="#0B0F14">Analytics</text><text x="24" y="344.90000000000003" font-family="Arial" font-size="18" fill="#2A3542">Organise data flows and</text><text x="24" y="369.20000000000005" font-family="Arial" font-size="18" fill="#2A3542">analytical views around</text><text x="24" y="393.50000000000006" font-family="Arial" font-size="18" fill="#2A3542">the decisions your team</text><text x="24" y="417.80000000000007" font-family="Arial" font-size="18" fill="#2A3542">needs to make.</text><text x="24" y="456.1000000000001" font-family="Arial" font-size="12" fill="#006D82">YOUR DECISION</text><text x="24" y="508.30000000000007" font-family="Arial" font-size="28" fill="#0B0F14">What data would</text><text x="24" y="546.1" font-family="Arial" font-size="28" fill="#0B0F14">help your team</text><text x="24" y="583.9" font-family="Arial" font-size="28" fill="#0B0F14">make a decision?</text><text x="24" y="625.6999999999999" font-family="Arial" font-size="12" fill="#006D82">POSSIBLE FOCUS</text><text x="24" y="669.9" font-family="Arial" font-size="20" fill="#0B0F14">Data sources and</text><text x="24" y="696.9" font-family="Arial" font-size="20" fill="#0B0F14">quality requirements</text><text x="24" y="743.9" font-family="Arial" font-size="20" fill="#0B0F14">Pipelines and</text><text x="24" y="770.9" font-family="Arial" font-size="20" fill="#0B0F14">analytical models</text><text x="24" y="817.9" font-family="Arial" font-size="20" fill="#0B0F14">Reporting and decision</text><text x="24" y="844.9" font-family="Arial" font-size="20" fill="#0B0F14">support</text><text x="24" y="883.9" font-family="Arial" font-size="12" fill="#006D82">SCOPE AND BOUNDARIES</text><text x="24" y="924.1" font-family="Arial" font-size="16" fill="#2A3542">Useful analysis depends on</text><text x="24" y="945.7" font-family="Arial" font-size="16" fill="#2A3542">source quality, access rights</text><text x="24" y="967.3000000000001" font-family="Arial" font-size="16" fill="#2A3542">and agreed definitions. Data</text><text x="24" y="988.9000000000001" font-family="Arial" font-size="16" fill="#2A3542">accuracy is not assumed.</text><text x="24" y="1026.5" font-family="Arial" font-size="12" fill="#006D82">KEEP EXPLORING</text><path d="M2 20 L20 2 M4 2 H20 V18" transform="translate(272 1054.7)" fill="none" stroke="#006D82" stroke-width="2"/><text x="24" y="1070.7" font-family="Arial" font-size="20" fill="#006D82">Back to AI, Data &amp;</text><text x="24" y="1097.7" font-family="Arial" font-size="20" fill="#006D82">Automation</text><path d="M2 20 L20 2 M4 2 H20 V18" transform="translate(272 1128.7)" fill="none" stroke="#006D82" stroke-width="2"/><text x="24" y="1144.7" font-family="Arial" font-size="20" fill="#006D82">AI Systems &amp; Agentic</text><text x="24" y="1171.7" font-family="Arial" font-size="20" fill="#006D82">Automation</text><path d="M2 20 L20 2 M4 2 H20 V18" transform="translate(272 1202.7)" fill="none" stroke="#006D82" stroke-width="2"/><text x="24" y="1214.7" font-family="Arial" font-size="16" fill="#006D82">All services</text></svg>