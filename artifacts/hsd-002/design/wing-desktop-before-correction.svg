amily="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">Plan and develop the software, integrations and foundations behind a digital product.</text><rect x="64" y="920" width="1312" height="1" fill="#D8D3C8"/><text x="64" y="984" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="400" fill="#006D82">Product Design &amp; Experience Engineering ↗</text><text x="64" y="1027.2" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">Understand user journeys and turn them into clear, usable interfaces and interaction</text><text x="64" y="1048.8" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">patterns.</text><rect x="64" y="1086.4" width="1312" height="1" fill="#D8D3C8"/><text x="64" y="1150.4" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="400" fill="#006D82">Commerce, Content &amp; Growth Platforms ↗</text><text x="64" y="1193.6000000000001" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">Connect commerce and content journeys with the systems used to manage and improve</text><text x="64" y="1215.2" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">them.</text><rect x="64" y="1252.8000000000002" width="1312" height="1" fill="#D8D3C8"/><text x="64" y="1300.8000000000002" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#006D82">All services ↗</text><text x="64" y="1414.4" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#006D82">EVIDENCE</text><text x="64" y="1478.6000000000001" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="400" fill="#0B0F14">Work and demos</text><text x="64" y="1544.6000000000001" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="400" fill="#0B0F14">Client work</text><text x="64" y="1586.4" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">No client projects are published here yet.</text><text x="64" y="1652" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="400" fill="#0B0F14">Hengshi-owned demos</text><text x="64" y="1693.8" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">No demos are published here yet. A demo will be labelled separately from client work.</text><text x="64" y="1919.3999999999999" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#00D4FF">LET’S TALK</text><text x="64" y="1991.6" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="400" fill="#FAF9F6">Tell us about your project.</text><text x="64" y="2050.3999999999996" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" fill="#D8D3C8">Book a 30-minute call to discuss what you need and see how we could help.</text><rect x="64" y="2088.7" width="304" height="56" fill="#00D4FF"/><text x="88" y="2119.7" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#0B0F14">Book a call</text><text x="64" y="2172.7" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#D8D3C8">30-minute introductory call.</text><rect x="64" y="2224.8999999999996" width="1312" height="1" fill="#2A3542"/><svg x="64" y="2264.8999999999996" width="32" height="32" viewBox="0 0 80 80"><rect width="80" height="80" fill="#0B0F14"/><g fill="none" stroke="#FAF9F6" stroke-width="6" stroke-linecap="square"><path d="M30 10 H10 V30 M50 10 H70 V30 M70 50 V70 H50 M30 70 H10 V50"/></g><path d="M16 52 H32 V40 H48 V28 H64" fill="none" stroke="#00D4FF" stroke-width="5"/><rect x="61" y="25" width="6" height="6" fill="#00D4FF"/></svg><text x="108" y="2285.8999999999996" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" fill="#FAF9F6">Hengshi Design</text><text x="64" y="2342.8999999999996" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#FAF9F6">Privacy policy    Accessibility</text><text