<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3076" viewBox="0 0 1440 3076"><title>HSD-002 detail Desktop 1440</title><rect width="1440" height="3076" fill="#FAF9F6"/><rect x="0" y="2482.8999999999996" width="1440" height="592.5999999999999" fill="#0B0F14"/><rect x="0" y="1643.7" width="1440" height="529.5999999999997" fill="#F3F1EA"/><rect x="0" y="0" width="1440" height="165" fill="#0B0F14"/><svg x="64" y="24" width="40" height="40" viewBox="0 0 80 80"><rect width="80" height="80" fill="#0B0F14"/><g fill="none" stroke="#FAF9F6" stroke-width="6" stroke-linecap="square"><path d="M30 10 H10 V30 M50 10 H70 V30 M70 50 V70 H50 M30 70 H10 V50"/></g><path d="M16 52 H32 V40 H48 V28 H64" fill="none" stroke="#00D4FF" stroke-width="5"/><rect x="61" y="25" width="6" height="6" fill="#00D4FF"/></svg><text x="120" y="51" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="600" fill="#FAF9F6">Hengshi Design</text><text x="950" y="50" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#FAF9F6">Search        Accessibility settings        3D World ↗</text><text x="64" y="133" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#FAF9F6">Home</text><text x="185" y="133" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#00D4FF">Services</text><text x="306" y="133" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#FAF9F6">Industries</text><text x="427" y="133" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#FAF9F6">Work</text><text x="548" y="133" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#FAF9F6">Demos</text><text x="669" y="133" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#FAF9F6">Insights</text><text x="790" y="133" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#FAF9F6">Experts</text><text x="911" y="133" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#FAF9F6">Trust</text><text x="1032" y="133" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#FAF9F6">About</text><text x="1153" y="133" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#FAF9F6">Contact</text><text x="1274" y="133" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#00D4FF">Book a call</text><text x="64" y="219" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#006D82">Home / Services / Digital Products &amp; Growth / Product Design &amp; Experience Engineering</text><text x="64" y="299.9" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#006D82">FORMAL SERVICE</text><text x="64" y="396.09999999999997" font-family="Inter,Arial,sans-serif" font-size="72" font-weight="400" fill="#0B0F14">Product Design &amp;</text><text x="64" y="493.29999999999995" font-family="Inter,Arial,sans-serif" font-size="72" font-weight="400" fill="#0B0F14">Experience Engineering</text><text x="64" y="570.5" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#2A3542">Understand user journeys and turn them into clear, usable</text><text x="64" y="602.9" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#2A3542">interfaces and interaction patterns.</text><text x="64" y="649.3" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#2A3542">Capability descriptions explain what we can discuss. They are not evidence of client delivery.</text><rect x="64" y="726.1999999999999" width="1312" height="1" fill="#D8D3C8"/><text x="64" y="802.1999999999999" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#006D82">YOUR DECISION</text><text x="64" y="866.4" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="400" fill="#0B0F14">How should the product work for the people using it?</text><text x="64" y="920.4" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">Start with the outcome you need, the people involved and the constraints your project</text><text x="64" y="942" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">must work within.</text><text x="64" y="1007.6" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#006D82">POSSIBLE FOCUS</text><text x="64" y="1071.8000000000002" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="400" fill="#0B0F14">What we can explore</text><rect x="64" y="1109.8000000000002" width="1312" height="1" fill="#D8D3C8"/><text x="64" y="1155.8000000000002" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="400" fill="#0B0F14">User journeys and information architecture</text><rect x="64" y="1188.9" width="1312" height="1" fill="#D8D3C8"/><text x="64" y="1234.9" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="400" fill="#0B0F14">Interface design and design systems</text><rect x="64" y="1268" width="1312" height="1" fill="#D8D3C8"/><text x="64" y="1314" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="400" fill="#0B0F14">Prototypes and usability evaluation</text><text x="64" y="1383.1" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#006D82">SCOPE AND BOUNDARIES</text><text x="64" y="1447.3" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="400" fill="#0B0F14">Agree the work before it begins</text><text x="64" y="1501.3" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">Research access, supported devices and accessibility criteria are agreed for each</text><text x="64" y="1522.8999999999999" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">project. Designs alone do not establish accessibility compliance.</text><text x="64" y="1568.5" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">Deliverables, responsibilities, timing and costs are agreed for each engagement. This</text><text x="64" y="1590.1" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">page does not make a delivery commitment.</text><text x="64" y="1719.7" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#006D82">EVIDENCE</text><text x="64" y="1783.9" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="400" fill="#0B0F14">Work and demos</text><text x="64" y="1849.9" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="400" fill="#0B0F14">Client work</text><text x="64" y="1891.7" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">No client projects are published here yet.</text><text x="64" y="1957.3" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="400" fill="#0B0F14">Hengshi-owned demos</text><text x="64" y="1999.1" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">No demos are published here yet. A demo will be labelled separately from client work.</text><text x="64" y="2056.7" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#0B0F14">Related insights, experts and assurance sources</text><text x="64" y="2095.7" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#2A3542">No reviewed sources are published for this service yet.</text><text x="64" y="2249.2999999999997" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#006D82">KEEP EXPLORING</text><text x="64" y="2301.4999999999995" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="400" fill="#006D82">Back to Digital Products &amp; Growth ↗</text><text x="64" y="2347.2999999999997" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#006D82">Platform &amp; Product Engineering ↗</text><text x="64" y="2390.2999999999997" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="400" fill="#006D82">Commerce, Content &amp; Growth Platforms ↗</text><text x="64" y="2429.2999999999997" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#006D82">All services ↗</text><text x="64" y="2566.8999999999996" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#00D4FF">LET’S TALK</text><text x="64" y="2639.0999999999995" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="400" fill="#FAF9F6">Tell us about your project.</text><text x="64" y="2697.8999999999996" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" fill="#D8D3C8">Book a 30-minute call to discuss what you need and see how we could help.</text><rect x="64" y="2736.2" width="304" height="56" fill="#00D4FF"/><text x="88" y="2767.2" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" fill="#0B0F14">Book a call</text><text x="64" y="2820.2" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" fill="#D8D3C8">30-minute introductory call.</text><rect x="64" y="2872.3999999999996" width="1312" height="1" fill="#2A3542"/><svg x="64" y="2912.3999999999996" width="32" height="32" viewBox="0 0 80 80"><rect width="80" height="80" fill="#0B0F14"/><g fill="none" stroke="#FAF9F6" stroke-width="6" stroke-linecap="square"><path d="M30 10 H10 V30 M50 10 H70 V30 M70 50 V70 H50 M30 70 H10 V50"/></g><path d="M16 52 H32 V40 H48 V28 H64" fill="none" stroke="#00D4FF" stroke-width="5"/><rect x="61" y="25" width="6" height="6" fill="#00D4FF"/></svg><text x="108" y="2933.3999999999996" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" fill="#FAF9F6">Hengshi Design</text><text x="64" y="2990.3999999999996" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#FAF9F6">Privacy policy    Accessibility</text><text x="64" y="3023.2999999999997" font-family="Inter,Arial,sans-serif" font-size="12