<!-- @dsCard group="Media and data" height=260 subtitle="The five direct-labelled series with marker and pattern text" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>DataSeriesKey preview</title>
<style>
  html, body { margin: 0; }
  body { padding: var(--hd-space-4); background: var(--hd-surface-canvas); color: var(--hd-text-primary); font-family: var(--font-text); }
  figure { margin: 0; max-width: 32rem; }
  figcaption { margin-bottom: var(--hd-space-3); font-weight: 800; }
</style>
</head>
<body>
<figure>
  <figcaption>Illustrative series key</figcaption>
  <ol class="hd-series">
    <li class="hd-series--context">
      <span class="hd-series__key"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2 V14 M2 8 H14" stroke="currentColor" stroke-width="2"/></svg><svg width="48" height="16" viewBox="0 0 48 16" aria-hidden="true"><path d="M0 8 H48" stroke="currentColor" stroke-width="3" stroke-dasharray="1 5 9 5"/></svg></span>
      <span class="hd-series__label">Context baseline</span>
      <span class="hd-series__pattern">plus · custom 1 5 9 5</span>
    </li>
    <li class="hd-series--dependency">
      <span class="hd-series__key"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="2"/></svg><svg width="48" height="16" viewBox="0 0 48 16" aria-hidden="true"><path d="M0 8 H48" stroke="currentColor" stroke-width="3" stroke-dasharray="12 3 3 3 3 3"/></svg></span>
      <span class="hd-series__label">Dependency map</span>
      <span class="hd-series__pattern">ring · custom 12 3 3 3 3 3</span>
    </li>
    <li class="hd-series--decision">
      <span class="hd-series__key"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1 V15 M1 8 H15" stroke="currentColor" stroke-width="3"/></svg><svg width="48" height="16" viewBox="0 0 48 16" aria-hidden="true"><path d="M0 8 H48" stroke="currentColor" stroke-width="3"/></svg></span>
      <span class="hd-series__label">Decision frame</span>
      <span class="hd-series__pattern">cross · solid</span>
    </li>
    <li class="hd-series--evidence">
      <span class="hd-series__key"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 L13.6 4.75 V11.25 L8 14.5 L2.4 11.25 V4.75 Z" fill="none" stroke="currentColor" stroke-width="2"/></svg><svg width="48" height="16" viewBox="0 0 48 16" aria-hidden="true"><path d="M0 8 H48" stroke="currentColor" stroke-width="3" stroke-dasharray="5 5"/></svg></span>
      <span class="hd-series__label">Evidence depth</span>
      <span class="hd-series__pattern">hexagon · even dash 5 5</span>
    </li>
    <li class="hd-series--risk">
      <span class="hd-series__key"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3 L13 13 M13 3 L3 13" stroke="currentColor" stroke-width="2"/></svg><svg width="48" height="16" viewBox="0 0 48 16" aria-hidden="true"><path d="M0 8 H48" stroke="currentColor" stroke-width="3" stroke-dasharray="13 4 4 4"/></svg></span>
      <span class="hd-series__label">Risk view</span>
      <span class="hd-series__pattern">X · custom 13 4 4 4</span>
    </li>
  </ol>
</figure>
</body>
</html>
