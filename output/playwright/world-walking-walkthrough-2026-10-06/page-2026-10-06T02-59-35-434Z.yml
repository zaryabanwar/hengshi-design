      - generic [ref=f1e215]: Engineering proposal · inside the accepted architecture
      - heading "From your vision to a complete visitor journey." [level=2] [ref=f1e216]
      - paragraph [ref=f1e217]: You provide the vision. We research the technical choices, recommend the solution, explain consequential tradeoffs and build reviewable results. The accepted reception and five-wing composition carries forward into a connected, eye-level experience with coherent surroundings in every permitted viewing direction.
      - generic [ref=f1e218]:
        - article [ref=f1e219]:
          - generic [ref=f1e220]: Accepted technology family
          - heading "Render the campus" [level=3] [ref=f1e221]
          - paragraph [ref=f1e222]: React Three Fiber and Three.js with WebGL connect the campus to the website. Blender supplies editable building and landscape assets, exported separately for efficient delivery.
        - article [ref=f1e223]:
          - generic [ref=f1e224]: Recommended evaluation
          - heading "Walk and look safely" [level=3] [ref=f1e225]
          - paragraph [ref=f1e226]: Mouse/touch input drives an upright camera and a collision-aware mover. Evaluate Rapier's character controller. Clicked destinations use safe connected routes; evaluate an authored route graph before adding navigation-mesh tooling.
        - article [ref=f1e227]:
          - generic [ref=f1e228]: Engineering proposal
          - heading "Load around the visitor" [level=3] [ref=f1e229]
          - paragraph [ref=f1e230]: A connected-area scheduler loads current and nearby spaces and retains recent ground for turn-backs. Download, decoding, rendering resources and collision readiness are separate stages. Unready ground cannot be crossed.
        - article [ref=f1e231]:
          - generic [ref=f1e232]: Appearance work remaining
          - heading "Create a believable place" [level=3] [ref=f1e233]
          - paragraph [ref=f1e234]: Near ground, surrounding buildings and vegetation, distant terrain and sky form one landscape. No exposed island edge or mountain wall on visitor routes. Inspector orbit and target-centred zoom are replaced by the designed walking controls in production.
        - article [ref=f1e235]:
          - generic [ref=f1e236]: Accepted authority boundary
          - heading "Connect real information" [level=3] [ref=f1e237]
          - paragraph [ref=f1e238]: Department boards, AI guidance, current staff availability and booking use the same eligible content and authoritative API as the semantic website. A decorative person or downloaded room cannot claim live staff or a confirmed booking.
        - article [ref=f1e239]:
          - generic [ref=f1e240]: Measured selection required
          - heading "Control cost on the device" [level=3] [ref=f1e241]
          - paragraph [ref=f1e242]: Spatial batches, reusable assets, detail variants and evaluated compression reduce work. Track shared resource ownership and release unused memory. Choose exact settings and libraries through compatible stable versions and actual-device measurements.
      - group [ref=f1e243]:
        - generic "What happens when a visitor walks or turns back" [ref=f1e244] [cursor=pointer]
      - group [ref=f1e245]:
