      - paragraph [ref=f1e94]: Scope and decisions are accepted; this detailed control/camera and measurement profile is a reviewed proposal awaiting integrated acceptance. This board has no walking engine or functioning movement controls. Approved production screens, exact thumb-pad mapping, authored geometry/rights, complete compatible technologies, measured device results and final visual approval remain required.
