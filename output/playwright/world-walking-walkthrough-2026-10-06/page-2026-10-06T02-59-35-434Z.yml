      - generic [ref=f1e52]: Accepted movement scope · proposed control details
      - heading "Walk through the place, rather than orbit its centre." [level=2] [ref=f1e53]
      - paragraph [ref=f1e54]: "The production experience puts you at eye level on connected ground. You can look around, steer freely, or choose a destination. The current campus viewer is an inspection model: its orbit and zoom controls do not demonstrate this walking experience."
      - generic [ref=f1e55]:
        - article [ref=f1e56]:
          - generic [ref=f1e57]: Desktop proposal
          - 'heading "Mouse: look, move and stop" [level=3] [ref=f1e58]'
          - paragraph [ref=f1e59]: Drag empty scene space to look around. An explicit Move action starts travel in your chosen direction; turning your view steers that travel along the ground. Stop remains available. Looking up does not make you fly.
          - paragraph [ref=f1e60]: Click an eligible floor point for a safe directed route. Clicking a department board opens its information instead. Dragging does not accidentally click a destination.
        - article [ref=f1e61]:
          - generic [ref=f1e62]: Touch proposal
          - 'heading "Touch: the same freedom" [level=3] [ref=f1e63]'
          - paragraph [ref=f1e64]: A scene drag changes the view. An optional thumb pad can move you while engaged, stopping on release or cancellation. Its exact gesture and cancellation design still needs the approved screen and accessibility inspection.
          - paragraph [ref=f1e65]: Move, Stop, directions, Look and destination actions also offer a one-finger option without dragging or using two fingers together. Keyboard-accessible actions remain available; WASD is not required.
      - figure "This is an explanatory diagram, not a new building proposal or model revision. The visitor camera stays upright; nearby architecture, layered terrain and sky give depth in every allowed direction. The production landscape must avoid exposed island edges and a repeating mountain wall. The accepted campus composition is retained." [ref=f1e66]:
        - 'img "Eye-level walking within a landscape with depth Conceptual diagram, not campus geometry: a person stays upright on a connected path, with a reception and department in the middle distance and layered terrain and sky beyond. Ground behind and beside the visitor remains supported while the next area is prepared." [ref=f1e67]'
      - heading "Load nearby areas without losing the ground beneath you." [level=3] [ref=f1e80]
      - list [ref=f1e81]:
        - listitem [ref=f1e82]:
          - strong [ref=f1e83]: Keep the current ground
          - text: The place supporting you and its collision data stay ready and protected. A visible building alone does not make its floor safe to enter.
        - listitem [ref=f1e84]:
          - strong [ref=f1e85]: Prepare what comes next
          - text: Load eligible nearby areas within the selected stream's limits. A turn changes priorities; it does not require downloading the whole landscape.
        - listitem [ref=f1e86]:
          - strong [ref=f1e87]: Handle a sudden reversal
          - text: Retain the required adjacent ground and a recent-area buffer. If the return path is not ready, stop at the last safe position while it prepares.
        - listitem [ref=f1e88]:
          - strong [ref=f1e89]: Hold safely and recover
          - text: At an unready edge, show truthful waiting/retry and equivalent website access. Do not walk into missing ground, jump to another room or silently change graphics stream.
      - generic [ref=f1e90]:
        - strong [ref=f1e91]: Reading a board stops travel.
        - text: Opening information, help or booking clears movement. So do input cancellation, leaving the World focus area, a hidden tab, graphics loss or Exit. Closing a panel or returning to the tab never restarts old travel automatically. Quick Access keeps the same core information and actions without 3D.
