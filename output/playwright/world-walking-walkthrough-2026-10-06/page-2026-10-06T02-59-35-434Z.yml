    - generic [ref=f1e142]:
      - generic [ref=f1e143]: How the team supports the visitor
      - heading "A consultation has a real owner." [level=2] [ref=f1e144]
      - paragraph [ref=f1e145]: The department board offers approved information, AI guidance, human help and direct booking. The proposed staff console handles the work behind those choices. These diagrams explain the system; they show no live staff or functioning console.
      - list [ref=f1e146]:
        - listitem [ref=f1e147]:
          - strong [ref=f1e148]: Staff declares availability
          - text: An authorized team member explicitly turns availability on for an approved department. An expired, withdrawn or unknown setting is unavailable.
        - listitem [ref=f1e149]:
          - strong [ref=f1e150]: Visitor chooses human help
          - text: The visitor consents to the permitted context transfer. Public availability offers help; it does not reserve a person or promise a response time.
        - listitem [ref=f1e151]:
          - strong [ref=f1e152]: Operator accepts the request
          - text: The Hengshi console checks current consent, eligibility and assignment. One guarded acceptance creates one conversation owner.
        - listitem [ref=f1e153]:
          - strong [ref=f1e154]: Continue the conversation
          - text: Governed text stays in the console. Voice/video needs separate opt-in. Direct Book and verified Contact remain recovery choices.
      - generic [ref=f1e155]:
        - article [ref=f1e156]:
          - generic [ref=f1e157]: Reconciled data proposal
          - heading "Intent and presence are different" [level=3] [ref=f1e158]
          - paragraph [ref=f1e159]: PostgreSQL records the authorized declaration. Redis holds its expiring presence view. A stored declaration alone cannot mean someone is online; stale signals, cache loss or revocation cannot keep the department available.
        - article [ref=f1e160]:
          - generic [ref=f1e161]: Accepted boundary
          - heading "Teams alerts the team" [level=3] [ref=f1e162]
          - paragraph [ref=f1e163]: Teams can suppress false availability and carry approved alerts. It does not create availability or own the visitor conversation. Alert delivery is separate from request acceptance and staff response.
        - article [ref=f1e164]:
          - generic [ref=f1e165]: Accepted workflow
          - heading "Booking has its own truth" [level=3] [ref=f1e166]
          - paragraph [ref=f1e167]: A visitor can book without chat or human handoff. Qualification, verified email and an eligible slot lead to a pending submission. Confirmation requires matching provider and local evidence; an alert or timeout cannot invent it.
        - article [ref=f1e168]:
          - generic [ref=f1e169]: Exact policies held
          - heading "Exceptions remain visible" [level=3] [ref=f1e170]
          - paragraph [ref=f1e171]: Operators inspect assignment, alert and booking exceptions within their approved scope. Pending stays pending until reconciled. Staff identities, delegates, expiry intervals and private-record retention still need their reviewed definitions.
      - group [ref=f1e172]:
        - 'generic "Staff sign-in: who verifies identity, permissions and logout?" [ref=f1e173] [cursor=pointer]'
      - group [ref=f1e174]:
        - generic "What happens when a team member turns live help on or off?" [ref=f1e175] [cursor=pointer]
      - group [ref=f1e176]:
        - generic "What happens after a visitor asks to speak with the team?" [ref=f1e177] [cursor=pointer]
      - group [ref=f1e178]:
        - generic "Who can edit, review and approve company information?" [ref=f1e179] [cursor=pointer]
      - paragraph [ref=f1e180]: When current availability cannot be verified, show unavailable and retain the usable information, AI where eligible, and Contact/Book routes. No avatars, desks or presence indicators may imply a team member is waiting when the system has no verified basis.
      - paragraph [ref=f1e181]: The availability split, additional interfaces and field/permission definitions passed the bounded independent documentation review at its listed hashes; integrated acceptance remains pending. Exact schemas, operational grants, expiry and legal retention remain held. No staff account, mailbox owner or new operational permission is assigned here.
