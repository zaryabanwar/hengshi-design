verified_local_findings:
  - id: FACT-001
    status: blocked
    evidence: apps/web/src/world/WorldHUD.tsx
    finding: WorldHUD returns before a later useMemo call, creating a hook-order defect.
  - id: FACT-002
    status: blocked
    evidence: apps/api/app/auth/deps.py
    finding: require_admin returns any authenticated active user without enforcing the admin role.
  - id: FACT-003
    status: blocked
    evidence: apps/api/app/db/session.py
    finding: Missing DATABASE_URL silently selects a local SQLite database.
  - id: FACT-004
    status: in_progress
    evidence: apps/web/public/models/hengshi-hq-atlanta-exterior-web.glb
    finding: The protected exterior GLB is 10002012 bytes and has no project-owned editable source found.
  - id: FACT-005
    status: not_started
    evidence: .github/workflows
    finding: No GitHub Actions workflow directory was present at the Phase 0 observation.
  - id: FACT-006
    status: in_progress
    evidence: docs/Hengshi_Design_Project_Consolidation_v3.docx
    finding: February 2026 readiness percentages are historical self-reported snapshots, not current acceptance evidence.
  - id: FACT-007
    status: accepted
    evidence: docs/phase-1-foundation/evidence/libreoffice-capability-2026-07-19.md
    finding: >-
      LibreOffice 26.2.4.2 is installed and its headless conversion capability now
      passes. A generated control DOCX and the 24-page historical consolidation both
      produced PDFs; every target page rendered for visual inspection. The historical
      source retains a blank table of contents and sparse continuation pages, which
      are source-layout limitations rather than converter failure. Independent QA
      passed the evidence and R-019 is closed with a fresh-conversion residual control.

