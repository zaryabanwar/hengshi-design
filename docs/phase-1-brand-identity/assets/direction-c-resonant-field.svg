<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Closed historical Resonant Field application specimen</title>
  <desc id="desc">Closed historical comparison evidence, not a current candidate: a spacious ink composition with large editorial type, one accountable evidence point, restrained cyan and violet arcs, generous negative space, and the full Hengshi Design name.</desc>
  <rect width="960" height="540" fill="#0B0F14"/>
  <g fill="none" stroke-width="5">
    <path d="M740 86 C600 96 564 230 620 336" stroke="#A98CFF"/>
    <path d="M790 62 C570 54 474 242 560 418" stroke="#00D4FF"/>
  </g>
  <circle cx="620" cy="336" r="9" fill="#A98CFF"/>
  <g fill="#FAF9F6" font-family="system-ui, 'Segoe UI', Arial, sans-serif">
    <text x="72" y="92" font-size="22" font-weight="700">Hengshi Design</text>
    <text x="72" y="224" font-size="72" font-weight="700">One decision</text>
    <text x="72" y="300" font-size="72" font-weight="700">shapes a system.</text>
    <text x="72" y="390" font-size="18">From complex ambition to accountable delivery.</text>
  </g>
  <text x="72" y="472" fill="#D8D3C8" font-family="ui-monospace, Consolas, monospace" font-size="13">C · SPATIAL RESONANCE · INTERNAL REVIEW</text>
</svg>
