<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Quiet Framework source-exploration application specimen</title>
  <desc id="desc">Source exploration only: a symmetrical paper composition with governed graphite modules, amber checkpoints, denser tabular evidence, restrained type scale, and the full Hengshi Design name. Review needed uses a filled triangle and long-dash status rail; Verified source uses a filled circle and solid status rail with source/date-required context. It is not the current identity by itself.</desc>
  <rect width="960" height="540" fill="#FAF9F6"/>
  <rect x="56" y="48" width="848" height="444" fill="none" stroke="#2A3542" stroke-width="3"/>
  <path d="M56 138 H904 M480 138 V492 M56 338 H904" stroke="#D8D3C8" stroke-width="2"/>
  <g fill="#0B0F14" font-family="system-ui, 'Segoe UI', Arial, sans-serif">
    <text x="88" y="100" font-size="22" font-weight="700">Hengshi Design</text>
    <text x="480" y="100" text-anchor="middle" font-size="16">EVIDENCE-LED INNOVATION DELIVERY PARTNER</text>
    <text x="88" y="206" font-size="40" font-weight="700">Govern the path.</text>
    <text x="88" y="256" font-size="40" font-weight="700">Verify each checkpoint.</text>
  </g>
  <g font-family="ui-monospace, Consolas, monospace" font-size="14">
    <text x="520" y="194" fill="#2A3542">01 · DECISION CONTEXT</text>
    <text x="520" y="274" fill="#2A3542">02 · EVIDENCE BOUNDARY</text>
    <text x="88" y="396" fill="#2A3542">OWNER</text><text x="280" y="396" fill="#0B0F14">Named role</text>
    <text x="88" y="432" fill="#2A3542">LIMITATION</text><text x="280" y="432" fill="#0B0F14">Stated beside the claim</text>
    <text x="88" y="468" fill="#2A3542">B · GOVERNED MODULARITY · INTERNAL REVIEW</text>
  </g>
  <g fill="#8A5600" stroke="#8A5600" font-family="ui-monospace, Consolas, monospace" font-size="14" font-weight="700" data-evidence-state="conditional" data-marker="filled-triangle" data-line="long-dash" data-dash-array="16 7" aria-label="Review needed — filled triangle and long-dash status rail">
    <path d="M520 212 L530 232 H510 Z" stroke="none"/>
    <path d="M542 224 H600" fill="none" stroke-width="3" stroke-dasharray="16 7"/>
    <text x="616" y="230" stroke="none">REVIEW NEEDED</text>
  </g>
  <g fill="#4F7D18" stroke="#4F7D18" font-family="ui-monospace, Consolas, monospace" font-size="14" font-weight="700" data-evidence-state="verified" data-marker="filled-circle" data-line="solid" data-context="visible-label-source-date-required" aria-label="Verified source — filled circle and solid status rail; source and date required">
    <circle cx="520" cy="304" r="6" stroke="none"/>
    <path d="M536 304 H600" fill="none" stroke-width="3"/>
    <text x="616" y="310" stroke="none">VERIFIED SOURCE</text>
    <text x="616" y="330" stroke="none">SOURCE + DATE REQUIRED</text>
  </g>
  <rect x="856" y="76" width="16" height="16" fill="#8A5600"/>
</svg>
