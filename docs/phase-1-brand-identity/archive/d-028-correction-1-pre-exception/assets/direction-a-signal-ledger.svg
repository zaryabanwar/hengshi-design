<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Retained Signal Ledger identity-system application specimen</title>
  <desc id="desc">Retained system evidence: an asymmetrical ink composition with a precise cyan evidence rail, large decision-led statement, full Hengshi Design name, system sans typography, and monospaced proof metadata. The iteration-2 logo is superseded and is not shown as current.</desc>
  <rect width="960" height="540" fill="#0B0F14"/>
  <rect x="56" y="48" width="8" height="444" fill="#2A3542"/>
  <path d="M60 420 L300 322 L516 328 L724 132" fill="none" stroke="#00D4FF" stroke-width="5"/>
  <circle cx="724" cy="132" r="8" fill="#00D4FF"/>
  <g fill="#FAF9F6" font-family="system-ui, 'Segoe UI', Arial, sans-serif">
    <text x="104" y="106" font-size="22" font-weight="700">Hengshi Design</text>
    <text x="104" y="200" font-size="58" font-weight="700">Frame the decision.</text>
    <text x="104" y="264" font-size="58" font-weight="700">Show the evidence.</text>
    <text x="104" y="378" font-size="18">Evidence-led innovation delivery partner</text>
  </g>
