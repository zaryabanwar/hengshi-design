    <text x="700" y="454">SOURCE + DATE REQUIRED</text>
  </g>
  <text x="104" y="474" fill="#D8D3C8" font-family="ui-monospace, Consolas, monospace" font-size="13">RETAINED SIGNAL LEDGER SYSTEM · INTERNAL REVIEW</text>
