  <title id="title">Quiet Framework source-exploration application specimen</title>
  <desc id="desc">Source exploration only: a symmetrical paper composition with governed graphite modules, amber checkpoints, denser tabular evidence, restrained type scale, and the full Hengshi Design name. It is not the current identity by itself.</desc>
