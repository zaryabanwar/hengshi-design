<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" role="img" aria-labelledby="title desc" data-status="EXPLORATORY — UNREGISTERED — TRADEMARK NOT CLEARED" data-geometry="favicon-16-v2">
  <title id="title">Hengshi Design exploratory favicon concept</title>
  <desc id="desc">Whole-pixel 16-unit optical two-rail Signal Ledger mark with a 2-unit diagonal. The terminal point and bend are removed only at 16–23 CSS pixels. Exploratory, unregistered, trademark not cleared.</desc>
  <rect width="16" height="16" rx="2" fill="#0B0F14"/>
  <g id="favicon-16-v2">
    <rect id="rail-left" x="3" y="3" width="2" height="10" fill="#FAF9F6"/>
    <rect id="rail-right" x="11" y="3" width="2" height="10" fill="#FAF9F6"/>
    <rect id="bridge" x="5" y="7" width="6" height="2" fill="#FAF9F6"/>
    <path id="signal-path" d="M4 12 L12 4" fill="none" stroke="#00D4FF" stroke-width="2" stroke-linecap="square"/>
  </g>
</svg>
